# DeepSpeed ZeRO-3 on 4 training GPUs, one node (PROGRESSION §0.4, 4B layouts).
# Use with CUDA_VISIBLE_DEVICES listing exactly 4 GPUs, e.g.
#   accelerate launch --config_file configs/accelerate/zero3_4gpu.yaml -m train.bench train ...
# bf16 compute with fp32 master weights; zero3_init_flag shards weights at load time, so load the
# model only after GRPOConfig exists (train/common.py does).
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

# GPU allocation for the training window (PROGRESSION.md "GPU allocation", "Run matrix", §1.4).
# Read by train/coordinator.py (one coordinator per node) and eval/watcher.py.
# Artifact layout: train/LAYOUT.md.
#
# Relative paths resolve against the coordinator's working directory (run it from the repo root).
# Point `paths.runs` / `paths.evals` at shared storage to let both nodes' watchers share eval work.
version: 1

paths:
  workdir: .
  runs: runs
  evals: evals

coordinator:
  poll_interval_s: 15
  kill_grace_s: 60              # SIGTERM -> wait -> SIGKILL, for the whole process group
  max_retries: 1                # crash -> resume from newest complete recovery checkpoint
  default_run_timeout_s: 28800  # overridden per size below, or per run with `timeout_s`
  # Training cutoff. Naive time = the node's local timezone; add an offset
  # (e.g. "2026-10-16T06:00:00+05:30") if the node clock is not in the owner's timezone.
  node_hard_deadline: "2026-10-16T06:00:00"
  deadline_eval_grace_s: 1800      # only used with --allow-shutdown
  deadline_transfer_grace_s: 1800  # only used with --allow-shutdown
  # Node release is OFF by default: when everything is done the coordinator writes
  # runs/_coordinator/<node>.idle and exits. A command runs only with --allow-shutdown AND this set.
  shutdown_cmd: null            # e.g. 'echo "would shut down"' or the Studio stop command

commands:
  # Placeholders: {run_id} {size} {reward} {seed} {gpus} {num_gpus} {run_dir}
  #               {vllm_gpus} {train_gpus} {num_vllm_gpus} {num_train_gpus}
  # GPU lists are physical indices; CUDA_VISIBLE_DEVICES is also set to {gpus}.
  train: >-
    uv run python train/grpo.py --run-id {run_id} --size {size} --reward {reward}
    --seed {seed} --gpus {gpus} --output-dir {run_dir}
  resume_flag: "--resume-from {resume_dir}"  # appended on a crash relaunch
  # Eval placeholders: {run_id} {size} {reward} {seed} {gpus} {num_gpus} {step} {ckpt_dir}
  #                    {output} {run_dir} {eval_dir}
  eval: >-
    uv run python eval/heldout.py --run-id {run_id} --size {size} --reward {reward}
    --seed {seed} --checkpoint {ckpt_dir} --step {step} --output {output} --gpus {gpus}

transfer:
  # Run after a run has ended and all its eval checkpoints are evaluated. Success writes
  # runs/<run_id>/TRANSFERRED. null = no copy needed (runs/ already on shared storage).
  # Placeholders: train placeholders + {eval_dir} {runs_root} {evals_root}
  command: null  # e.g. rsync -a {run_dir}/ /teamspace/shared/runs/{run_id}/ && rsync -a {eval_dir}/ /teamspace/shared/evals/{run_id}/
  timeout_s: 3600
  retries: 2
  max_concurrent: 2

checkpoints:
  pruning_enabled: true   # PROGRESSION §1.4: resume verified in the dry run; delete recovery ckpts after final integrity check
  keep_last: 2
  required_eval_files: ["config.json", "*.safetensors"]  # final-step integrity check

eval:
  enabled: true
  gpus_per_eval: 1
  timeout_s: 5400
  retries: 1
  poll_interval_s: 30
  stale_claim_s: 900
  lend_idle_gpus: true  # "eval falls behind": GPUs no remaining run needs join eval (N1 GPU 4-5)
  watch_scope: all      # all = every run under paths.runs; node = only this node's runs
  max_restarts: 5

sizes:
  # Timeouts: benchmark step time plus ~10 min per recovery checkpoint (optimizer save, 6 runs writing at
  # once), with margin. Measured on the real 2B runs: ~15 min per 50 steps -> ~5 h per run. 4B saves
  # every 100 steps (configs/sizes/4b.yaml), asynchronously by default (checkpoints.async_recovery).
  0.8b:
    gpus_per_run: 1
    run_timeout_s: 21600
  2b:
    gpus_per_run: 1
    run_timeout_s: 28800
  4b:
    gpus_per_run: 4
    run_timeout_s: 28800
    # 4 ZeRO-3 ranks with colocated vLLM (DECISIONS #9); the default train_command applies.

runs:
  2b-rob-s1: {size: 2b, reward: robust, seed: 1}
  2b-rob-s2: {size: 2b, reward: robust, seed: 2}
  2b-rob-s3: {size: 2b, reward: robust, seed: 3}
  2b-leak-s1: {size: 2b, reward: leaky, seed: 1}
  2b-leak-s2: {size: 2b, reward: leaky, seed: 2}
  2b-leak-s3: {size: 2b, reward: leaky, seed: 3}
  0.8b-rob-s1: {size: 0.8b, reward: robust, seed: 1}
  0.8b-rob-s2: {size: 0.8b, reward: robust, seed: 2}
  0.8b-rob-s3: {size: 0.8b, reward: robust, seed: 3}
  0.8b-leak-s1: {size: 0.8b, reward: leaky, seed: 1}
  0.8b-leak-s2: {size: 0.8b, reward: leaky, seed: 2}
  0.8b-leak-s3: {size: 0.8b, reward: leaky, seed: 3}
  4b-rob-s1: {size: 4b, reward: robust, seed: 1}
  4b-rob-s2: {size: 4b, reward: robust, seed: 2}
  4b-rob-s3: {size: 4b, reward: robust, seed: 3}
  4b-leak-s1: {size: 4b, reward: leaky, seed: 1}
  4b-leak-s2: {size: 4b, reward: leaky, seed: 2}
  4b-leak-s3: {size: 4b, reward: leaky, seed: 3}
  # ADR 0005 v2 round, ADR 0006 cap 1,024 (exploratory; run ids keep them out of H1/H2/H5). Timeout 10 h:
  # 4x longer answers than v1, so generation dominates the step.
  v2-2b-rob-s1:
    {size: 2b, reward: robust, seed: 1, timeout_s: 36000, train_command: &v2cmd "uv run python train/grpo.py
      --run-id {run_id} --size {size} --reward {reward} --seed {seed} --gpus {gpus} --output-dir {run_dir}
      --variant v2-think"}
  v2-2b-rob-s2: {size: 2b, reward: robust, seed: 2, timeout_s: 36000, train_command: *v2cmd}
  v2-2b-rob-s3: {size: 2b, reward: robust, seed: 3, timeout_s: 36000, train_command: *v2cmd}
  v2-2b-leak-s1: {size: 2b, reward: leaky, seed: 1, timeout_s: 36000, train_command: *v2cmd}
  v2-2b-leak-s2: {size: 2b, reward: leaky, seed: 2, timeout_s: 36000, train_command: *v2cmd}
  v2-2b-leak-s3: {size: 2b, reward: leaky, seed: 3, timeout_s: 36000, train_command: *v2cmd}
  # v2 extended to 4B and 0.8B (ADR 0005 "extend if the effect holds"; owner 2026-10-12)
  v2-4b-rob-s1: {size: 4b, reward: robust, seed: 1, timeout_s: 36000, train_command: *v2cmd}
  v2-4b-rob-s2: {size: 4b, reward: robust, seed: 2, timeout_s: 36000, train_command: *v2cmd}
  v2-4b-rob-s3: {size: 4b, reward: robust, seed: 3, timeout_s: 36000, train_command: *v2cmd}
  v2-4b-leak-s1: {size: 4b, reward: leaky, seed: 1, timeout_s: 36000, train_command: *v2cmd}
  v2-4b-leak-s2: {size: 4b, reward: leaky, seed: 2, timeout_s: 36000, train_command: *v2cmd}
  v2-4b-leak-s3: {size: 4b, reward: leaky, seed: 3, timeout_s: 36000, train_command: *v2cmd}
  v2-0.8b-rob-s1: {size: 0.8b, reward: robust, seed: 1, timeout_s: 21600, train_command: *v2cmd}
  v2-0.8b-rob-s2: {size: 0.8b, reward: robust, seed: 2, timeout_s: 21600, train_command: *v2cmd}
  v2-0.8b-rob-s3: {size: 0.8b, reward: robust, seed: 3, timeout_s: 21600, train_command: *v2cmd}
  v2-0.8b-leak-s1: {size: 0.8b, reward: leaky, seed: 1, timeout_s: 21600, train_command: *v2cmd}
  v2-0.8b-leak-s2: {size: 0.8b, reward: leaky, seed: 2, timeout_s: 21600, train_command: *v2cmd}
  v2-0.8b-leak-s3: {size: 0.8b, reward: leaky, seed: 3, timeout_s: 21600, train_command: *v2cmd}

# Groups: a queue runs in order on the group's GPUs. A group starts only after every group in
# `after` is drained, and a run starts only when all its GPUs are free (no training, no eval).
nodes:
  node1:
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    eval_gpus: [6, 7]
    groups:
      # Block 1 (~2 h): six 2B runs, 1 GPU each
      - {name: n1-g0, gpus: [0], queue: [2b-rob-s1]}
      - {name: n1-g1, gpus: [1], queue: [2b-leak-s1]}
      - {name: n1-g2, gpus: [2], queue: [2b-rob-s2]}
      - {name: n1-g3, gpus: [3], queue: [2b-leak-s2]}
      - {name: n1-g4, gpus: [4], queue: [2b-rob-s3]}
      - {name: n1-g5, gpus: [5], queue: [2b-leak-s3]}
      # Block 2: v2 2B runs (ADR 0005, cap 1,024 per ADR 0006), 1 GPU each, after the whole 2B block.
      # The 4B pair that ran here (P2) moved to node2's 4B queues (PROGRESSION Change log 2026-10-12).
      - {name: n1-v2-g0, gpus: [0], after: [n1-g0, n1-g1, n1-g2, n1-g3, n1-g4, n1-g5], queue: [v2-2b-rob-s1]}
      - {name: n1-v2-g1, gpus: [1], after: [n1-g0, n1-g1, n1-g2, n1-g3, n1-g4, n1-g5], queue: [v2-2b-leak-s1]}
      - {name: n1-v2-g2, gpus: [2], after: [n1-g0, n1-g1, n1-g2, n1-g3, n1-g4, n1-g5], queue: [v2-2b-rob-s2]}
      - {name: n1-v2-g3, gpus: [3], after: [n1-g0, n1-g1, n1-g2, n1-g3, n1-g4, n1-g5], queue: [v2-2b-leak-s2]}
      - {name: n1-v2-g4, gpus: [4], after: [n1-g0, n1-g1, n1-g2, n1-g3, n1-g4, n1-g5], queue: [v2-2b-rob-s3]}
      - {name: n1-v2-g5, gpus: [5], after: [n1-g0, n1-g1, n1-g2, n1-g3, n1-g4, n1-g5], queue: [v2-2b-leak-s3]}
      # Block 3: v2 4B (seeds 1 and 3; seed 2 on node2), robust and leaky side by side. No eval GPU while
      # they train: their evals run on all 8 GPUs afterwards.
      - name: n1-v2-4b-rob
        gpus: [0, 1, 2, 3]
        after: [n1-v2-g0, n1-v2-g1, n1-v2-g2, n1-v2-g3, n1-v2-g4, n1-v2-g5]
        queue: [v2-4b-rob-s1, v2-4b-rob-s3]
      - name: n1-v2-4b-leak
        gpus: [4, 5, 6, 7]
        after: [n1-v2-g0, n1-v2-g1, n1-v2-g2, n1-v2-g3, n1-v2-g4, n1-v2-g5]
        queue: [v2-4b-leak-s1, v2-4b-leak-s3]
  node2:
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    eval_gpus: [6, 7]  # eval overflow during 0.8B; taken back by the 4B leaky queue and by v2 0.8B on GPU 6
    groups:
      # Block 1 (~2 h): six 0.8B runs, 1 GPU each
      - {name: n2-g0, gpus: [0], queue: [0.8b-rob-s1]}
      - {name: n2-g1, gpus: [1], queue: [0.8b-leak-s1]}
      - {name: n2-g2, gpus: [2], queue: [0.8b-rob-s2]}
      - {name: n2-g3, gpus: [3], queue: [0.8b-leak-s2]}
      - {name: n2-g4, gpus: [4], queue: [0.8b-rob-s3]}
      - {name: n2-g5, gpus: [5], queue: [0.8b-leak-s3]}
      # Blocks 2-4: all three 4B pairs (P1, P3, then P2 moved from node1), robust on GPU 0-3, leaky on GPU 4-7
      - name: n2-4b-rob
        gpus: [0, 1, 2, 3]
        after: [n2-g0, n2-g1, n2-g2, n2-g3]
        queue: [4b-rob-s1, 4b-rob-s3, 4b-rob-s2]
      - name: n2-4b-leak
        gpus: [4, 5, 6, 7]
        after: [n2-g4, n2-g5]
        queue: [4b-leak-s1, 4b-leak-s3, 4b-leak-s2]
      # Block 5: v2 (exploratory) after all 4B v1 runs and their evals: the seed-2 4B pair in sequence on GPU 0-3,
      # v2 0.8B robust then leaky per seed on GPU 4, 5, 6; GPU 7 stays free for evals.
      - name: n2-v2-4b
        gpus: [0, 1, 2, 3]
        after: [n2-4b-rob, n2-4b-leak]
        queue: [v2-4b-rob-s2, v2-4b-leak-s2]
      - {name: n2-v2-08-s1, gpus: [4], after: [n2-4b-rob, n2-4b-leak], queue: [v2-0.8b-rob-s1, v2-0.8b-leak-s1]}
      - {name: n2-v2-08-s2, gpus: [5], after: [n2-4b-rob, n2-4b-leak], queue: [v2-0.8b-rob-s2, v2-0.8b-leak-s2]}
      - {name: n2-v2-08-s3, gpus: [6], after: [n2-4b-rob, n2-4b-leak], queue: [v2-0.8b-rob-s3, v2-0.8b-leak-s3]}

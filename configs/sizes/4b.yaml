# Qwen3.5-4B: GPU layout only (configs/grpo.yaml holds the common budget). DECISIONS #9 pending.
#
# The run gets 4 GPUs from the coordinator (--gpus, --vllm-server-gpus, --train-gpus).
# 64 completions per step (8 x 8) must split evenly over the training ranks, so 3 ranks is
# impossible without changing the budget (never done, H5). Two supported layouts:
#
#   server-2train (default): 1 GPU `trl vllm-serve` + 2 ZeRO-3 training ranks; the 4th GPU idles.
#   colocate-4train:         4 ZeRO-3 ranks, each with a colocated vLLM engine. Use:
#       generation: colocate
#       train_ranks: 4
#       vllm_server_gpus: 0
#       vllm_gpu_memory_utilization: 0.25
#
# Pick the faster one from `make bench` (runs/bench/summary.json) and record it in DECISIONS #9.
layout:
  generation: server
  train_ranks: 2
  hf_train_ranks: 4          # HF fallback: 4 GPUs training, in-process generation (PROGRESSION)
  vllm_server_gpus: 1
  vllm_server_gpu_memory_utilization: 0.9

# ADR 0005 item 3, exploratory v2 round "work before answering": `train/grpo.py --variant v2-think`.
#
# Merged over configs/grpo.yaml after the size file. train/grpo.py refuses any key outside
# VARIANT_KEYS (budget.enable_thinking, budget.max_completion_length). The run records the variant in
# train_config.json and run_manifest.json, so its identity differs from every v1 run, and
# eval/heldout.py evaluates its checkpoints with thinking on and the same answer cap.
# Context: 1,536-token prompt + 512 = 2,048 = layout.vllm_max_model_length (checked at start).
budget:
  enable_thinking: true        # training prompts end inside an open <think> block
  max_completion_length: 512   # answer cap, reasoning included (ADR 0005: 512 instead of 256)

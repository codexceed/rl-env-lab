# Replication plan for project version v3 (exploratory; ADR 0007): the SPEC_v3.md task set in data/v3, thinking on,
# answer cap 1,024, prompts up to 2,048 tokens, eval weights every 100 steps (`train/grpo.py --variant v3`), on two
# 8x H200 nodes. 12 runs: 4B / 2B x robust / leaky x seeds 1-3. Guide: README, "Reproduce the study".
# Gate first: `make data-v3`, `make acceptance-v3`, `make diagnostic-v3 SIZE=4b` and `SIZE=2b`, `make dry-v3`.
#
#   uv run python train/coordinator.py --config configs/replicate/v3.yaml --node node1 --print-plan
#   uv run python train/coordinator.py --config configs/replicate/v3.yaml --node node1
#
# Same schema and shared sections as configs/allocation.yaml; the only differences are `--variant v3` in
# commands.train, no training cutoff and the timeouts. Layout rules (reports/learnings.md §5):
#   - GPU 6-7 on each node evaluate and never train. In the study all of v3 trained on one node with its 4B evals
#     queued behind; a second node then cleared 60 of them in ~1.5 h. Here each node evaluates as it trains.
#   - 4B runs take 4 GPUs (colocated vLLM), 2B runs 1 GPU. A timeout on every run.
#
# Expected wall clock (measured run times, logs/runs/*/status.json): ~8.5 h per node, plus the eval tail.
version: 1

paths:
  workdir: .
  runs: runs
  evals: evals

coordinator:
  poll_interval_s: 15
  kill_grace_s: 60              # SIGTERM -> wait -> SIGKILL, for the whole process group
  max_retries: 1                # crash -> resume from newest complete recovery checkpoint
  default_run_timeout_s: 28800  # overridden per size below
  # Training cutoff: null = none. Set an ISO datetime with an offset (node clocks run on UTC), e.g.
  # "2026-10-16T06:00:00+00:00", to stop training at a fixed time.
  node_hard_deadline: null
  deadline_eval_grace_s: 1800      # only used with --allow-shutdown
  deadline_transfer_grace_s: 1800  # only used with --allow-shutdown
  # Node release is OFF: when everything is done the coordinator writes runs/_coordinator/<node>.idle and exits.
  shutdown_cmd: null

commands:
  # Placeholders: {run_id} {size} {reward} {seed} {gpus} {num_gpus} {run_dir}
  #               {vllm_gpus} {train_gpus} {num_vllm_gpus} {num_train_gpus}
  # GPU lists are physical indices; CUDA_VISIBLE_DEVICES is also set to {gpus}.
  train: >-
    uv run python train/grpo.py --run-id {run_id} --size {size} --reward {reward}
    --seed {seed} --gpus {gpus} --output-dir {run_dir} --variant v3
  resume_flag: "--resume-from {resume_dir}"  # appended on a crash relaunch
  # Eval placeholders: {run_id} {size} {reward} {seed} {gpus} {num_gpus} {step} {ckpt_dir}
  #                    {output} {run_dir} {eval_dir}
  # heldout.py reads the variant from the run dir: data/v3, thinking on, cap, prompt budget and context, no extra flag.
  eval: >-
    uv run python eval/heldout.py --run-id {run_id} --size {size} --reward {reward}
    --seed {seed} --checkpoint {ckpt_dir} --step {step} --output {output} --gpus {gpus}
  eval_base: >-
    uv run python eval/heldout.py --size {size} --checkpoint base {variant_args} --output {output} --gpus {gpus}

transfer:
  command: null  # runs/ and evals/ stay on the node; copy results off before cleanup (README, "Results off the node")
  timeout_s: 3600
  retries: 2
  max_concurrent: 2

checkpoints:
  pruning_enabled: true   # delete recovery checkpoints once the final eval weights pass the integrity check
  keep_last: 2
  required_eval_files: ["config.json", "*.safetensors"]  # final-step integrity check

eval:
  enabled: true
  gpus_per_eval: 1
  timeout_s: 5400
  retries: 1
  poll_interval_s: 30
  stale_claim_s: 900
  lend_idle_gpus: true  # GPUs no remaining run needs join eval
  watch_scope: all      # all = every run under paths.runs; node = only this node's runs
  max_restarts: 5

sizes:
  # Measured v3 run times: 4B 2.3-3.0 h (4 GPUs), 2B 3.5-4.2 h (1 GPU). Longer prompts and thinking-on answers;
  # timeouts as configs/allocation.yaml gave the v3 runs.
  2b:
    gpus_per_run: 1
    run_timeout_s: 36000
  4b:
    gpus_per_run: 4
    run_timeout_s: 43200

runs:
  v3-4b-rob-s1: {size: 4b, reward: robust, seed: 1}
  v3-4b-rob-s2: {size: 4b, reward: robust, seed: 2}
  v3-4b-rob-s3: {size: 4b, reward: robust, seed: 3}
  v3-4b-leak-s1: {size: 4b, reward: leaky, seed: 1}
  v3-4b-leak-s2: {size: 4b, reward: leaky, seed: 2}
  v3-4b-leak-s3: {size: 4b, reward: leaky, seed: 3}
  v3-2b-rob-s1: {size: 2b, reward: robust, seed: 1}
  v3-2b-rob-s2: {size: 2b, reward: robust, seed: 2}
  v3-2b-rob-s3: {size: 2b, reward: robust, seed: 3}
  v3-2b-leak-s1: {size: 2b, reward: leaky, seed: 1}
  v3-2b-leak-s2: {size: 2b, reward: leaky, seed: 2}
  v3-2b-leak-s3: {size: 2b, reward: leaky, seed: 3}

# Groups: a queue runs in order on the group's GPUs. A group starts only after every group in `after` is drained,
# and a run starts only when all its GPUs are free (no training, no eval).
#
#            GPU 0   GPU 1   GPU 2   GPU 3   GPU 4   GPU 5   GPU 6   GPU 7
#   node1    [ 4B: rob s1, leak s1, rob s2 (~8.5 h) ] [2B s1][2B s1] [ eval ......]
#                                                     rob    leak   (~4 h, then lent to eval)
#   node2    [ 4B: leak s2, rob s3, leak s3 (~8.5 h)] [2B   ][2B   ] [ eval ......]
#                                                     rob    leak   (seeds 2 -> 3, ~8 h)
nodes:
  node1:
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    eval_gpus: [6, 7]
    groups:
      - {name: n1-v3-4b, gpus: [0, 1, 2, 3], queue: [v3-4b-rob-s1, v3-4b-leak-s1, v3-4b-rob-s2]}
      - {name: n1-v3-2b-rob, gpus: [4], queue: [v3-2b-rob-s1]}
      - {name: n1-v3-2b-leak, gpus: [5], queue: [v3-2b-leak-s1]}
  node2:
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    eval_gpus: [6, 7]
    groups:
      - {name: n2-v3-4b, gpus: [0, 1, 2, 3], queue: [v3-4b-leak-s2, v3-4b-rob-s3, v3-4b-leak-s3]}
      - {name: n2-v3-2b-rob, gpus: [4], queue: [v3-2b-rob-s2, v3-2b-rob-s3]}
      - {name: n2-v3-2b-leak, gpus: [5], queue: [v3-2b-leak-s2, v3-2b-leak-s3]}

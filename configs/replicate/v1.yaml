# Replication plan for project version v1 (PREREG.md, SPEC.md tasks, thinking off, answer cap 256) on two 8x H200
# nodes. 18 runs: 0.8B / 2B / 4B x robust / leaky x seeds 1-3. Guide: README, "Reproduce the study".
#
#   uv run python train/coordinator.py --config configs/replicate/v1.yaml --node node1 --print-plan
#   uv run python train/coordinator.py --config configs/replicate/v1.yaml --node node1
#
# Same schema and shared sections as configs/allocation.yaml (which records how the study actually ran), except no
# training cutoff. Layout rules learned the hard way (reports/learnings.md §5):
#   - GPU 6-7 on each node evaluate and never train: a node with all 8 GPUs training left 24 checkpoints
#     waiting for evals for hours. GPUs that no remaining run needs join eval too (eval.lend_idle_gpus).
#   - 4B runs take 4 GPUs (4 ZeRO-3 ranks with colocated vLLM, DECISIONS #9); 2B and 0.8B take 1 GPU.
#   - Every run has a timeout (sizes.*.run_timeout_s): the run ends, the node stays up.
#
# Expected wall clock (measured run times, logs/runs/*/status.json): node1 ~6.5 h, node2 ~5.5 h, plus the eval tail.
version: 1

paths:
  workdir: .
  runs: runs
  evals: evals

coordinator:
  poll_interval_s: 15
  kill_grace_s: 60              # SIGTERM -> wait -> SIGKILL, for the whole process group
  max_retries: 1                # crash -> resume from newest complete recovery checkpoint
  default_run_timeout_s: 28800  # overridden per size below
  # Training cutoff: null = none. Set an ISO datetime with an offset (node clocks run on UTC), e.g.
  # "2026-10-16T06:00:00+00:00", to stop training at a fixed time.
  node_hard_deadline: null
  deadline_eval_grace_s: 1800      # only used with --allow-shutdown
  deadline_transfer_grace_s: 1800  # only used with --allow-shutdown
  # Node release is OFF: when everything is done the coordinator writes runs/_coordinator/<node>.idle and exits.
  shutdown_cmd: null

commands:
  # Placeholders: {run_id} {size} {reward} {seed} {gpus} {num_gpus} {run_dir}
  #               {vllm_gpus} {train_gpus} {num_vllm_gpus} {num_train_gpus}
  # GPU lists are physical indices; CUDA_VISIBLE_DEVICES is also set to {gpus}.
  train: >-
    uv run python train/grpo.py --run-id {run_id} --size {size} --reward {reward}
    --seed {seed} --gpus {gpus} --output-dir {run_dir}
  resume_flag: "--resume-from {resume_dir}"  # appended on a crash relaunch
  # Eval placeholders: {run_id} {size} {reward} {seed} {gpus} {num_gpus} {step} {ckpt_dir}
  #                    {output} {run_dir} {eval_dir}
  eval: >-
    uv run python eval/heldout.py --run-id {run_id} --size {size} --reward {reward}
    --seed {seed} --checkpoint {ckpt_dir} --step {step} --output {output} --gpus {gpus}
  eval_base: >-
    uv run python eval/heldout.py --size {size} --checkpoint base {variant_args} --output {output} --gpus {gpus}

transfer:
  command: null  # runs/ and evals/ stay on the node; copy results off before cleanup (README, "Results off the node")
  timeout_s: 3600
  retries: 2
  max_concurrent: 2

checkpoints:
  pruning_enabled: true   # delete recovery checkpoints once the final eval weights pass the integrity check
  keep_last: 2
  required_eval_files: ["config.json", "*.safetensors"]  # final-step integrity check

eval:
  enabled: true
  gpus_per_eval: 1
  timeout_s: 5400
  retries: 1
  poll_interval_s: 30
  stale_claim_s: 900
  lend_idle_gpus: true  # GPUs no remaining run needs join eval
  watch_scope: all      # all = every run under paths.runs; node = only this node's runs
  max_restarts: 5

sizes:
  # Measured v1 run times: 0.8B 1.3-1.6 h, 2B 2.9-3.5 h (1 GPU, synchronous recovery saves), 4B 1.3-1.5 h (4 GPUs).
  0.8b:
    gpus_per_run: 1
    run_timeout_s: 21600
  2b:
    gpus_per_run: 1
    run_timeout_s: 28800
  4b:
    gpus_per_run: 4
    run_timeout_s: 28800

runs:
  2b-rob-s1: {size: 2b, reward: robust, seed: 1}
  2b-rob-s2: {size: 2b, reward: robust, seed: 2}
  2b-rob-s3: {size: 2b, reward: robust, seed: 3}
  2b-leak-s1: {size: 2b, reward: leaky, seed: 1}
  2b-leak-s2: {size: 2b, reward: leaky, seed: 2}
  2b-leak-s3: {size: 2b, reward: leaky, seed: 3}
  0.8b-rob-s1: {size: 0.8b, reward: robust, seed: 1}
  0.8b-rob-s2: {size: 0.8b, reward: robust, seed: 2}
  0.8b-rob-s3: {size: 0.8b, reward: robust, seed: 3}
  0.8b-leak-s1: {size: 0.8b, reward: leaky, seed: 1}
  0.8b-leak-s2: {size: 0.8b, reward: leaky, seed: 2}
  0.8b-leak-s3: {size: 0.8b, reward: leaky, seed: 3}
  4b-rob-s1: {size: 4b, reward: robust, seed: 1}
  4b-rob-s2: {size: 4b, reward: robust, seed: 2}
  4b-rob-s3: {size: 4b, reward: robust, seed: 3}
  4b-leak-s1: {size: 4b, reward: leaky, seed: 1}
  4b-leak-s2: {size: 4b, reward: leaky, seed: 2}
  4b-leak-s3: {size: 4b, reward: leaky, seed: 3}

# Groups: a queue runs in order on the group's GPUs. A group starts only after every group in `after` is drained,
# and a run starts only when all its GPUs are free (no training, no eval).
#
#            GPU 0   GPU 1   GPU 2   GPU 3   GPU 4   GPU 5   GPU 6   GPU 7
#   node1    [ 2B x6, one GPU each (~3.5 h) ...............] [ eval ......]
#            [ 4B seed 3: rob -> leak (~3 h) ] [ lent to eval ] [ eval ......]
#   node2    [ 4B seeds 1-2: rob, leak, rob, leak (~5.5 h)  ] [0.8B][0.8B] [ eval ......]
#                                                             rob   leak  (seeds 1 -> 2 -> 3, ~4.5 h)
nodes:
  node1:
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    eval_gpus: [6, 7]
    groups:
      - {name: n1-2b-g0, gpus: [0], queue: [2b-rob-s1]}
      - {name: n1-2b-g1, gpus: [1], queue: [2b-leak-s1]}
      - {name: n1-2b-g2, gpus: [2], queue: [2b-rob-s2]}
      - {name: n1-2b-g3, gpus: [3], queue: [2b-leak-s2]}
      - {name: n1-2b-g4, gpus: [4], queue: [2b-rob-s3]}
      - {name: n1-2b-g5, gpus: [5], queue: [2b-leak-s3]}
      - name: n1-4b
        gpus: [0, 1, 2, 3]
        after: [n1-2b-g0, n1-2b-g1, n1-2b-g2, n1-2b-g3, n1-2b-g4, n1-2b-g5]
        queue: [4b-rob-s3, 4b-leak-s3]
  node2:
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    eval_gpus: [6, 7]
    groups:
      - {name: n2-4b, gpus: [0, 1, 2, 3], queue: [4b-rob-s1, 4b-leak-s1, 4b-rob-s2, 4b-leak-s2]}
      - {name: n2-08b-rob, gpus: [4], queue: [0.8b-rob-s1, 0.8b-rob-s2, 0.8b-rob-s3]}
      - {name: n2-08b-leak, gpus: [5], queue: [0.8b-leak-s1, 0.8b-leak-s2, 0.8b-leak-s3]}

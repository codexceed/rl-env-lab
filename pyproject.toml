[project]
name = "envlab"
version = "0.1.0"
description = "Billing-simulator RL environment: robust vs leaky rewards under GRPO"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU training/eval stack. Linux nodes only: `uv sync --extra gpu`.
gpu = [
    "torch>=2.8; sys_platform == 'linux'",
    "transformers>=4.57; sys_platform == 'linux'",
    "trl>=0.24; sys_platform == 'linux'",
    "datasets>=4.0; sys_platform == 'linux'",
    "accelerate>=1.10; sys_platform == 'linux'",
    "deepspeed>=0.17; sys_platform == 'linux'",
    "vllm>=0.11; sys_platform == 'linux'",
    # Fast gated delta-net kernels for Qwen3.5 hybrid attention (pure Python/Triton).
    # causal-conv1d has no PyPI wheels; it is built on the node, see train/README.md.
    "flash-linear-attention>=0.5.2; sys_platform == 'linux'",
    # Lightning experiments mirror of the run logs (train/logsync.py, imported lazily).
    "litlogger>=2026.8.28; sys_platform == 'linux'",
]
# Plots for eval/compare.py: `uv sync --group dev --extra report`.
report = [
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # same version as the ruff pre-commit hook
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "train", "eval", "tests"]
extend-exclude = ["runs", "data", "evals"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff's own
]

[tool.ruff.lint.isort]
known-first-party = ["envlab", "train", "eval"]
# lazy annotations everywhere, so forward references work below Python 3.14 (the 3.12 fallback)
required-imports = ["from __future__ import annotations"]

[tool.pyright]
include = ["src", "train", "eval", "tests"]
exclude = ["**/__pycache__", "runs", "data", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["src", "."]
# the GPU stack (torch, transformers, trl, vllm) is a Linux-only extra and is not installed for
# checks; its imports are lazy, so an unresolved import is reported but does not fail the check
reportMissingImports = "warning"

[tool.pydoclint]
style = "google"
# types live in the signatures, not repeated in docstrings
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# a one-line summary is enough for small helpers; sections are checked wherever they are written
skip-checking-short-docstrings = true

[tool.importlinter]
root_packages = ["envlab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The simulator is the bottom layer: it never imports tasks, graders or prompts"
type = "forbidden"
source_modules = ["envlab.sim"]
forbidden_modules = ["envlab.tasks", "envlab.verify", "envlab.prompts"]

[[tool.importlinter.contracts]]
name = "The environment package runs without the GPU stack"
type = "forbidden"
source_modules = ["envlab"]
forbidden_modules = ["torch", "transformers", "trl", "vllm", "deepspeed", "accelerate"]

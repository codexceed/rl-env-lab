name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # one required check per tool; versions come from .pre-commit-config.yaml, settings from pyproject.toml
    name: ${{ matrix.hook }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook: [ruff-check, ruff-format, pyright, pydoclint, import-linter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-py314-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx --with pre-commit-uv pre-commit run ${{ matrix.hook }} --all-files --show-diff-on-failure

  tests:
    # unit tests only: no GPU, no Lightning account, no model downloads.
    # 3.14 is the runtime; 3.12 keeps the kernel fallback a one-line switch.
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: make test
        env:
          UV_PYTHON: ${{ matrix.python }}
